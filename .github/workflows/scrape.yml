name: Speiseplan aktualisieren

on:
  schedule:
    # 3× täglich (jeden Tag) zu krummen Minuten – vermeidet überlastete runde-Stunden-Queues.
    # Falls ein Lauf viele Stunden Verspätung hat, fängt der nächste es auf.
    - cron: '17 3  * * *'   # 03:17 UTC = 05:17 CEST
    - cron: '17 7  * * *'   # 07:17 UTC = 09:17 CEST
    - cron: '17 10 * * *'   # 10:17 UTC = 12:17 CEST
  workflow_dispatch:     # manuell auslösbar

permissions:
  contents: write        # für den git push

jobs:
  scrape:
    name: Scrape menu.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        run: python scraper.py

      - name: menu.json committen (nur bei Änderung)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen – kein Commit nötig."
          else
            git commit -m "chore: update menu.json [skip ci]"
            git push
          fi
